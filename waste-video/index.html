<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <script src="assets/vendor/three.min.js"></script>
    <style>
      :root {
        --ground: #f4efe6;
        --ink: #1b1d1f;
        --muted: #625d55;
        --accent: #ff7a1a;
        --accent-dark: #c85a0c;
        --accent-deep: #a94705;
        --clean-deep: #157a4f;
        --clean: #1fa36b;
        --night: #16181b;
        --font: "Poppins", sans-serif;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1920px;
        height: 1080px;
        background: #c9dbe8;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="41"
      data-width="1920"
      data-height="1080"
    >
      <canvas id="world" width="1920" height="1080"></canvas>
      <div
        id="intro"
        data-composition-id="intro"
        data-composition-src="compositions/intro.html"
        data-start="0"
        data-duration="7"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="waste"
        data-composition-id="waste"
        data-composition-src="compositions/waste.html"
        data-start="7.4"
        data-duration="5.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="brand"
        data-composition-id="brand"
        data-composition-src="compositions/brand.html"
        data-start="15.2"
        data-duration="3.8"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="app"
        data-composition-id="app"
        data-composition-src="compositions/app.html"
        data-start="19"
        data-duration="12"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="pickup"
        data-composition-id="pickup"
        data-composition-src="compositions/pickup.html"
        data-start="32.2"
        data-duration="4.6"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="ending"
        data-composition-id="ending"
        data-composition-src="compositions/ending.html"
        data-start="37"
        data-duration="4"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>
    <script src="assets/world.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
